<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download DeGhost Edu — the official DeGhost parent app for Android and iOS. Fees, attendance, library, and school updates from DeGhost School ERP.">
    <meta name="robots" content="noindex, follow">
    <title>DeGhost Edu App Download | DeGhost</title>
    <link rel="canonical" href="https://deghost.com/m/">
    <link rel="shortcut icon" href="../image/degost-fav.png" type="image/x-icon">
    <link rel="stylesheet" href="../fonts/fontawesome-5/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1787FC;
            --primary-dark: #0b6bd3;
            --primary-soft: #eaf3fe;
            --ink: #0f172a;
            --muted: #5b6b7f;
            --line: #e6ecf3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: #f3f6fb;
            position: relative;
            overflow-x: hidden;
        }
        .app-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background: #f2f5fa;
        }
        .app-bg .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 26%,
                rgba(255, 255, 255, .98) 0%,
                rgba(200, 222, 250, .55) 35%,
                rgba(160, 195, 240, .28) 68%,
                rgba(145, 185, 235, .1) 100%);
            border: none;
            box-shadow:
                inset 0 0 28px rgba(255, 255, 255, .65),
                0 10px 28px rgba(94, 151, 227, .12);
            animation: bubble-float 16s ease-in-out infinite;
            opacity: .88;
        }
        .app-bg .bubble.pink {
            background: radial-gradient(circle at 30% 26%,
                rgba(255, 255, 255, .98) 0%,
                rgba(250, 220, 235, .5) 38%,
                rgba(240, 195, 220, .24) 70%,
                rgba(235, 185, 210, .08) 100%);
            border: none;
            opacity: .78;
        }
        .app-bg .b1 { width: 320px; height: 320px; left: -80px; bottom: 8%; }
        .app-bg .b2 { width: 280px; height: 280px; right: -60px; top: 10%; animation-delay: -4s; }
        .app-bg .b3 { width: 140px; height: 140px; left: 20%; top: 20%; animation-delay: -2s; }
        @keyframes bubble-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .card {
            width: min(480px, 100%);
            background: rgba(255, 255, 255, .9);
            border: 1px solid rgba(255, 255, 255, .95);
            border-radius: 24px;
            box-shadow: 0 24px 60px -20px rgba(15, 23, 42, .15);
            padding: 52px 40px 44px;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: pop .5s cubic-bezier(.22, .61, .36, 1);
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(20px) scale(.98); }
            to { opacity: 1; transform: none; }
        }

        .logo { height: 76px; width: auto; margin: 0 auto 26px; }

        h1 { font-family: 'Sora', sans-serif; font-size: 1.65rem; letter-spacing: -0.02em; margin-bottom: 10px; }

        .sub { color: var(--muted); font-size: .98rem; margin-bottom: 28px; }

        .qr-wrap {
            display: none;
            margin: 0 auto 28px;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            width: fit-content;
        }
        .qr-wrap.on { display: block; }
        .qr-wrap img { width: 180px; height: 180px; }
        .qr-wrap span {
            display: block;
            margin-top: 10px;
            font-size: .78rem;
            color: var(--muted);
            font-weight: 500;
        }

        .store-btns {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .store-btns a {
            display: block;
            height: 40px;
            line-height: 0;
            transition: transform .3s;
        }
        .store-btns a:hover { transform: translateY(-3px); }
        .store-btns img {
            height: 40px;
            width: auto;
            display: block;
        }

        .note {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: .85rem;
        }
        .note a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .note a:hover { color: var(--primary-dark); }

        .redirecting {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted);
            font-size: .92rem;
            margin-bottom: 24px;
        }
        .redirecting.on { display: flex; }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="app-bg" aria-hidden="true">
        <span class="bubble b1"></span>
        <span class="bubble pink b2"></span>
        <span class="bubble b3"></span>
    </div>
    <div class="card">
        <img class="logo" src="../image/deghost-logo-full.svg" alt="DeGhost logo">
        <h1>Get the DeGhost Edu App</h1>
        <p class="sub">Your school's companion app for parents — fees, attendance, library, and more.</p>

        <div class="redirecting" id="redirecting">
            <span class="spinner"></span> Taking you to the store…
        </div>

        <div class="qr-wrap" id="qrWrap">
            <img src="../image/qr-deghost-m.png" alt="QR code for https://deghost.com/m">
            <span>Scan with your phone · deghost.com/m</span>
        </div>

        <div class="store-btns">
            <a href="https://play.google.com/store/apps/details?id=com.deghost.degedu&hl=en">
                <img alt="Get it on Google Play" src="../image/google-play-badge.png">
            </a>
            <a href="https://apps.apple.com/us/app/deghost-edu/id6783858855">
                <img alt="Download on the App Store" src="../image/app-store-badge.svg">
            </a>
            <a href="https://www.amazon.com/gp/product/B0DBH911KB">
                <img alt="Amazon Appstore" src="../image/amazon.png">
            </a>
        </div>

        <p class="note">Looking for the ERP instead? <a href="../">Visit DeGhost ERP</a></p>
    </div>

    <script>
        (function () {
            var PLAY = 'https://play.google.com/store/apps/details?id=com.deghost.degedu&hl=en';
            var APPLE = 'https://apps.apple.com/us/app/deghost-edu/id6783858855';
            var ua = navigator.userAgent || '';

            var target = null;
            if (/android/i.test(ua)) {
                target = PLAY;
            } else if (/iPad|iPhone|iPod/.test(ua) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                target = APPLE;
            }

            if (target) {
                document.getElementById('redirecting').classList.add('on');
                window.location.replace(target);
                setTimeout(function () {
                    document.getElementById('redirecting').classList.remove('on');
                }, 4000);
            } else {
                document.getElementById('qrWrap').classList.add('on');
            }
        })();
    </script>
</body>

</html>
