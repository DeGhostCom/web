<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to see your attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Inter, system-ui, sans-serif;
            background: #f4f6f9;
            color: #111827;
            line-height: 1.5;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 28px 16px 48px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .step {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .step-head {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 16px 16px 12px;
        }

        .n {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1787FC;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            display: grid;
            place-items: center;
        }

        h2 { font-size: 1.05rem; font-weight: 700; }

        .step p { margin-top: 4px; color: #4b5563; font-size: 0.98rem; }

        a {
            color: #0b6bd3;
            font-weight: 700;
            word-break: break-all;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            border-top: 1px solid #e5e7eb;
        }

        .help {
            text-align: center;
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
            border-radius: 14px;
            padding: 14px 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>How to see your attendance</h1>

        <article class="step">
            <div class="step-head">
                <div class="n">1</div>
                <div>
                    <h2>Open this website</h2>
                    <p><a href="https://has.deghost.com/emp/" target="_blank" rel="noopener">https://has.deghost.com/emp/</a></p>
                </div>
            </div>
        </article>

        <article class="step">
            <div class="step-head">
                <div class="n">2</div>
                <div>
                    <h2>Click Login with Office 365</h2>
                </div>
            </div>
            <img src="1.jpg" alt="Click Login with Office 365">
        </article>

        <article class="step">
            <div class="step-head">
                <div class="n">3</div>
                <div>
                    <h2>Type your school email, then click Next</h2>
                    <p>Then type your password.</p>
                </div>
            </div>
            <img src="2.png" alt="Type your school email and click Next">
        </article>

        <article class="step">
            <div class="step-head">
                <div class="n">4</div>
                <div>
                    <h2>Click Accept</h2>
                </div>
            </div>
            <img src="3.png" alt="Click Accept">
        </article>

        <article class="step">
            <div class="step-head">
                <div class="n">5</div>
                <div>
                    <h2>Click Attendance on the left</h2>
                </div>
            </div>
            <img src="4.png" alt="Click Attendance">
        </article>

        <p class="help">If you cannot log in, please contact IT.</p>
    </div>
</body>

</html>
